[package]
name="actors"
version="0.1.0"
edition = "2021"

[dependencies]
domain={path="../domain"}
player={path="../player"}
audiolib={path="../audiolib"}
rstest="0.26.1"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
async-std = { version = "1", features = ["attributes"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
kameo="0.19.2"
ulid="1"
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres"] }
chrono = "0.4"