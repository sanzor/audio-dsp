[package]
name="domain"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
audiolib={path="../audiolib"}
clap = { version = "4.4", features = ["derive"] }
kameo="0.19.2"
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.7", default-features = false, features = ["macros", "postgres", "chrono"] }
