# Part of backend-ci.yml — shows as "backend-ci / lint / {audit,clippy,fmt}".
name: backend-ci-lint

on:
  workflow_call:

jobs:
  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: ./scripts/ci/backend/audit.sh

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/ci/backend/setup-toolchain.sh --components clippy --system-deps
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          shared-key: clippy
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: ./scripts/ci/backend/clippy.sh

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/ci/backend/setup-toolchain.sh --components rustfmt
      - run: ./scripts/ci/backend/fmt.sh
