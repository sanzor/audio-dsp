# Part of backend-ci.yml — shows as "backend-ci / build / {build-image,unit-tests}".
name: backend-ci-build

on:
  workflow_call:

jobs:
  build-image:
    name: build-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Same build as scripts/ci/backend/build-image.sh; the action adds GHA layer caching.
      - uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/api/Dockerfile
          tags: audio-dsp-api:ci
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
          cache-from: type=gha,scope=backend-api
          cache-to: type=gha,scope=backend-api,mode=max
      - uses: actions/upload-artifact@v4
        with:
          name: backend-image   # consumed by backend-cd.yml
          path: ${{ runner.temp }}/image.tar
          retention-days: 3
          if-no-files-found: error

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/ci/backend/setup-toolchain.sh --system-deps
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: ./scripts/ci/backend/unit-tests.sh
