# Frontend CD: push the image frontend-ci built, then point the environment at it.
# Called by ci.yml after frontend-ci passes on main/staging/dev.
name: frontend-cd

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true

jobs:
  publish-image:
    name: publish image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend-image   # built by frontend-ci.yml
          path: ${{ runner.temp }}
      - run: docker load -i "${{ runner.temp }}/image.tar"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: >
          ./scripts/ci/shared/publish-image.sh audio-dsp-web:ci
          "ghcr.io/${{ github.repository }}-frontend" "${{ github.sha }}" "${{ github.ref_name }}"

  deploy:
    name: deploy
    needs: publish-image
    # Off until environments/<env>/frontend-deployment.yaml exists in the config repo:
    # set repository variable FRONTEND_DEPLOY_ENABLED=true to turn it on.
    if: vars.FRONTEND_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout this repo (for scripts)
        uses: actions/checkout@v4
      - name: Checkout config repo
        uses: actions/checkout@v4
        with:
          repository: sanzor/infrastructure-configs
          token: ${{ secrets.GH_PAT }}
          ref: main
          path: .gitops
      - working-directory: .gitops
        run: >
          ../scripts/ci/shared/gitops-update-image.sh
          "${{ inputs.environment }}" frontend-deployment.yaml
          "ghcr.io/${{ github.repository }}-frontend" "${{ github.sha }}"
