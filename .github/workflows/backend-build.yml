# Reusable — called by backend.yml.
name: backend-build

on:
  workflow_call:
    inputs:
      image-artifact:
        description: Artifact name the built image tarball is uploaded as
        type: string
        required: true

jobs:
  build-image:
    name: build-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Same build as scripts/ci/backend-build-image.sh; the action is used here for GHA layer caching.
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/api/Dockerfile
          tags: audio-dsp-api:ci
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
          cache-from: type=gha,scope=backend-api
          cache-to: type=gha,scope=backend-api,mode=max
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.image-artifact }}
          path: ${{ runner.temp }}/image.tar
          retention-days: 3
          if-no-files-found: error

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: test
      - run: ./scripts/ci/backend-unit-tests.sh
