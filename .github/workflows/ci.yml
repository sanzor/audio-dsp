name: Rust CI + Docker

on:
  push:
    branches: [ "**" ]        # run on all branches
  pull_request:
    branches: [ "main", "staging" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # -------------------------------------------
  # 1️⃣ Lint and format
  # -------------------------------------------
  lint:
    name: Lint and Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run rustfmt
        run: cargo fmt -- --check

      - name: Run clippy
        run: cargo clippy -- -D warnings

  # -------------------------------------------
  # 2️⃣ Build and unit tests
  # -------------------------------------------
  build-test:
    name: Build and Test
    runs-on: ubuntu-latest
    needs: lint   # only run if lint passes

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build release binary
        run: cargo build --release

      - name: Run tests
        run: cargo test --all --verbose

  # -------------------------------------------
  # 3️⃣ Docker image build and smoke test
  # -------------------------------------------
  docker:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    needs: build-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t rust-api:latest .

      - name: Run API smoke test
        run: |
          docker run -d --rm -p 8080:8080 --name rust-api rust-api:latest
          sleep 5
          curl -f http://localhost:8080/health || (docker logs rust-api && exit 1)
          docker stop rust-api

  # -------------------------------------------
  # 4️⃣ (Optional) Deploy - main only
  # -------------------------------------------
  deploy:
    name: Deploy (placeholder)
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy step placeholder
        run: echo "Deploying to production... (add your script here)"
