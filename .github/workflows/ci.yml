name: Rust CI/CD

on:
  push:
    branches: [ main, staging, dev ]
  pull_request:
    branches: [ main, staging ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read
  packages: write   # needed to push to GHCR

jobs:
  # --------------------------------------------------
  # 1️⃣ Lint and Format
  # --------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
            toolchain: stable

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libasound2-dev

      - name: Run rustfmt
        run: cargo fmt -- --check
      - name: Run clippy
        run: cargo clippy --workspace --all-targets

  # --------------------------------------------------
  # 2️⃣ Build Docker image and run tests inside it
  # --------------------------------------------------
  build-and-test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      # 🧰 Install required system dependencies
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libasound2-dev \
            libssl-dev \
            libudev-dev \
            libx11-dev \
            libxcb1-dev \
            libxrandr-dev \
            libxi-dev

      - name: Build Docker image
        working-directory: api
        run: docker build -t ${{ github.repository }}:test -f api/Dockerfile .

      - name: Run tests inside container
        run: |
          docker run --rm \
            -e DATABASE_URL=postgres://postgres:${{ secrets.POSTGRES_PASSWORD }}@localhost:5432/postgres \
            ${{ github.repository }}:test cargo test --all --verbose

      - name: Save Docker image
        run: docker save ${{ github.repository }}:test | gzip > image.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar.gz

  # --------------------------------------------------
  # 3️⃣ Integration Tests (with Postgres)
  # --------------------------------------------------
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'

    services:
      postgres:
        image: postgres:15
        ports: ['5432:5432']
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # 🧰 Install required system dependencies
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libasound2-dev \
            libssl-dev \
            libudev-dev \
            libx11-dev \
            libxcb1-dev \
            libxrandr-dev \
            libxi-dev

      - uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load saved Docker image
        run: docker load -i image.tar.gz

      - name: Export environment variables
        run: |
          echo "APP_ENV=${{ github.ref_name }}" >> $GITHUB_ENV
          echo "DATABASE_URL=postgres://postgres:${{ secrets.POSTGRES_PASSWORD }}@localhost:5432/postgres" >> $GITHUB_ENV

      - name: Run integration tests
        run: docker run --rm \
            -e DATABASE_URL=$DATABASE_URL \
            ${{ github.repository }}:test cargo test --test integration -- --nocapture

  # --------------------------------------------------
  # 4️⃣ Publish tested image to GHCR
  # --------------------------------------------------
  publish:
    name: Publish to GHCR
    runs-on: ubuntu-latest
    needs: [build-and-test, integration-tests]
    if: success()
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # 🧰 Install required system dependencies
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libasound2-dev \
            libssl-dev \
            libudev-dev \
            libx11-dev \
            libxcb1-dev \
            libxrandr-dev \
            libxi-dev

      - uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker image
        run: docker load -i image.tar.gz

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Tag Docker image
        run: |
          docker tag ${{ github.repository }}:test ghcr.io/${{ github.repository }}:${{ github.sha }}
          docker tag ${{ github.repository }}:test ghcr.io/${{ github.repository }}:${{ github.ref_name }}

      - name: Push image to GHCR
        run: |
          docker push ghcr.io/${{ github.repository }}:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}:${{ github.ref_name }}
