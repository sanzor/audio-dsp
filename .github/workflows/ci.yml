name: Rust CI/CD

on:
  push:
    branches: [main, staging, dev]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

permissions:
  contents: read
  packages: write

jobs:
  # -----------------------------
  # 1️⃣ Lint & Clippy
  # -----------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Install build dependencies (needed for Clippy)
      - run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libudev-dev libssl-dev

      - run: cargo fmt -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # -----------------------------
  # 2️⃣ Build & Unit Tests in Docker
  # -----------------------------
  build-test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Build builder stage
        run: docker build --target builder -t myapp-builder -f api/Dockerfile .

      - name: Run cargo test inside builder
        run: docker run --rm myapp-builder cargo test --workspace --all-targets

      - name: Build final image
        run: docker build -t myapp:test -f api/Dockerfile .

      - name: Save Docker image
        run: docker save myapp:test | gzip > image.tar.gz

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar.gz
          if-no-files-found: error

  # -----------------------------
  # 3️⃣ Integration Tests (with Postgres)
  # -----------------------------
  integration-tests:
    runs-on: ubuntu-latest
    needs: build-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'

    services:
      postgres:
        image: postgres:15
        ports: ['5432:5432']
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: docker-image
      - name: Load Docker image
        run: docker load -i image.tar.gz
      - name: Run integration tests
        run: |
          docker run --rm \
            -e DATABASE_URL=postgres://postgres:${{ secrets.POSTGRES_PASSWORD }}@localhost:5432/postgres \
            myapp:test /usr/local/bin/app --test-mode

  # -----------------------------
  # 4️⃣ Publish to GHCR
  # -----------------------------
  publish:
    runs-on: ubuntu-latest
    needs: [build-test, integration-tests]
    if: success() && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker image
        run: docker load -i image.tar.gz

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Tag and Push
        run: |
          docker tag myapp:test ghcr.io/${{ github.repository }}:${{ github.sha }}
          docker tag myapp:test ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          docker push ghcr.io/${{ github.repository }}:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}:${{ github.ref_name }}
