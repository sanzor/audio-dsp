name: Rust CI/CD

on:
  push:
    branches: [ main, staging, dev ]
  pull_request:
    branches: [ main, staging ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # --------------------------------------------------
  # 1️⃣ Lint and Format
  # --------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run rustfmt
        run: cargo fmt -- --check
      - name: Run clippy
        run: cargo clippy -- -D warnings

  # --------------------------------------------------
  # 2️⃣ Build and Unit Tests
  # --------------------------------------------------
  build-test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Build release binary
        run: cargo build --release
      - name: Run unit tests
        run: cargo test --all --verbose

  # --------------------------------------------------
  # 3️⃣ Docker Build (Reusable Artifact)
  # --------------------------------------------------
  docker:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t ghcr.io/${{ github.repository }}:${{ github.sha }} .
      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Push image
        run: docker push ghcr.io/${{ github.repository }}:${{ github.sha }}

  # --------------------------------------------------
  # 4️⃣ Integration Tests (with secrets)
  # --------------------------------------------------
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'

    # Define Postgres container for tests
    services:
      postgres:
        image: postgres:15
        ports: ['5432:5432']
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Export environment variables
        run: |
          echo "APP_ENV=${{ github.ref_name }}" >> $GITHUB_ENV
          echo "DATABASE_URL=postgres://postgres:${{ secrets.POSTGRES_PASSWORD }}@localhost:5432/postgres" >> $GITHUB_ENV
      - name: Build release binary
        run: cargo build --release
      - name: Run integration tests
        run: cargo test --test integration -- --nocapture

  # --------------------------------------------------
  # 5️⃣ Deploy - environment specific
  # --------------------------------------------------
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: integration-tests
    # Only run on main/staging/prod, based on GitHub environments
    if: |
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/staging' ||
      github.ref == 'refs/heads/prod'
    environment: ${{ github.ref_name }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # (Option A) Fetch secrets from GitHub Environments
      - name: Print deploy info
        run: |
          echo "Deploying to ${{ github.ref_name }} environment"
          echo "Using secret DATABASE_URL: ${{ secrets.DATABASE_URL }}"
          echo "Using secret VAULT_TOKEN (if configured)"

      # (Option B) If you use HashiCorp Vault later:
      # - name: Retrieve secrets from Vault
      #   uses: hashicorp/vault-action@v3
      #   with:
      #     url: https://vault.example.com
      #     method: approle
      #     roleId: ${{ secrets.VAULT_ROLE_ID }}
      #     secretId: ${{ secrets.VAULT_SECRET_ID }}
      #     secrets: |
      #       secret/data/${{ github.ref_name }}/db password | POSTGRES_PASSWORD
      #       secret/data/${{ github.ref_name }}/app api_key | API_KEY

      - name: Deploy app
        run: ./scripts/deploy-${{ github.ref_name }}.sh
