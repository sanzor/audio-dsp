# Reusable — called by ci.yml.
name: frontend

on:
  workflow_call:

jobs:
  check:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [lint, test, build]   # build = tsc -b typecheck + vite build
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: ./scripts/ci/frontend.sh install
      - run: ./scripts/ci/frontend.sh ${{ matrix.task }}
