# Reusable — called by ci.yml.
name: backend

on:
  workflow_call:
    inputs:
      publish:
        description: Push the image to GHCR after tests pass
        type: boolean
        default: false
    outputs:
      image-repo:
        value: ${{ jobs.publish-image.outputs.image-repo }}
      image-tag:
        value: ${{ jobs.publish-image.outputs.image-tag }}

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: lint
    uses: ./.github/workflows/backend-lint.yml

  build:
    name: build
    needs: lint
    uses: ./.github/workflows/backend-build.yml
    with:
      image-artifact: backend-api-image

  integration-tests:
    name: integration tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          targets: wasm32-unknown-unknown
          cache-key: test
      - run: ./scripts/ci/backend-integration-tests.sh

  publish-image:
    name: publish image
    needs: integration-tests
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-repo: ${{ steps.push.outputs.image-repo }}
      image-tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: backend-api-image
          path: ${{ runner.temp }}
      - run: docker load -i "${{ runner.temp }}/image.tar"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          ./scripts/ci/backend-publish-image.sh "$repo" "$GITHUB_SHA" "$GITHUB_REF_NAME"
          echo "image-repo=$repo" >> "$GITHUB_OUTPUT"
