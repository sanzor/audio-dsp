# Fast feedback on feature branches (the full pipeline runs via ci.yml on main/staging/dev and PRs).
name: Quick Check

on:
  push:
    branches-ignore: [main, staging, dev]
    paths:
      - "backend/**"
      - "scripts/ci/**"
      - ".github/actions/setup-rust/**"
      - ".github/workflows/quick-check.yml"

jobs:
  fast-check:
    name: fmt + check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt
          cache-key: check
      - run: ./scripts/ci/backend-fmt.sh
      - name: cargo check
        working-directory: backend
        run: cargo check --workspace --all-targets
