# Fast feedback on feature-branch pushes (the full pipeline runs via ci.yml on main/staging/dev and PRs).
name: Quick Check

on:
  push:
    branches-ignore: [main, staging, dev]
    paths:
      - "backend/**"
      - "scripts/ci/backend/**"
      - ".github/workflows/quick-check.yml"

jobs:
  fast-check:
    name: fmt + check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/ci/backend/setup-toolchain.sh --components rustfmt --system-deps
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          shared-key: check
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: ./scripts/ci/backend/fmt.sh
      - name: cargo check
        working-directory: backend
        run: cargo check --workspace --all-targets
