# Reusable — called by ci.yml after a published backend image; also runnable by hand.
name: cd

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      image-repo:
        type: string
        required: true
      image-tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      environment:
        description: Environment folder in infrastructure-configs (dev, staging, main)
        type: string
        required: true
      image-repo:
        description: e.g. ghcr.io/owner/repo
        type: string
        required: true
      image-tag:
        description: Image tag (commit SHA)
        type: string
        required: true

jobs:
  update-config-repo:
    name: update gitops config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: app

      - uses: actions/checkout@v4
        with:
          repository: sanzor/infrastructure-configs
          token: ${{ secrets.GH_PAT }}
          ref: main
          path: infra

      - working-directory: infra
        run: ../app/scripts/ci/gitops-update-image.sh "${{ inputs.environment }}" "${{ inputs.image-repo }}" "${{ inputs.image-tag }}"
