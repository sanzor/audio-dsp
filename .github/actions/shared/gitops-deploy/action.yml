name: GitOps deploy
description: Points an environment manifest in the infrastructure-configs repo at a new image (scripts/ci/shared/gitops-update-image.sh).

inputs:
  environment:
    description: Environment folder in the config repo (dev, staging, main)
    required: true
  manifest:
    description: Manifest file name inside environments/<environment>/
    required: true
  image-repo:
    required: true
  image-tag:
    required: true
  token:
    description: Token with push access to the config repo
    required: true
  config-repo:
    default: sanzor/infrastructure-configs

runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
      with:
        repository: ${{ inputs.config-repo }}
        token: ${{ inputs.token }}
        ref: main
        path: .gitops
    - shell: bash
      working-directory: .gitops
      run: >
        "$GITHUB_WORKSPACE/scripts/ci/shared/gitops-update-image.sh"
        "${{ inputs.environment }}" "${{ inputs.manifest }}"
        "${{ inputs.image-repo }}" "${{ inputs.image-tag }}"
