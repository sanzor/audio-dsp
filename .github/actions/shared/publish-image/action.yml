name: Publish image
description: Loads an image tarball built by a CI job (artifact) and pushes it to GHCR.

inputs:
  artifact:
    description: Artifact holding image.tar
    required: true
  local-image:
    description: Tag the image was built with, e.g. audio-dsp-api:ci
    required: true
  image-repo:
    description: Target repository, e.g. ghcr.io/owner/repo
    required: true
  tags:
    description: Space-separated tags to push
    required: true
  token:
    description: Token with packages:write
    required: true

runs:
  using: composite
  steps:
    - uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.artifact }}
        path: ${{ runner.temp }}/${{ inputs.artifact }}
    - shell: bash
      run: docker load -i "${{ runner.temp }}/${{ inputs.artifact }}/image.tar"
    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.token }}
    - shell: bash
      run: ./scripts/ci/shared/publish-image.sh "${{ inputs.local-image }}" "${{ inputs.image-repo }}" ${{ inputs.tags }}
