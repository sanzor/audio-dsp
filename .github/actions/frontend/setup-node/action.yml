name: Setup Node (frontend)
description: pnpm + Node with the pnpm store cached, then installs frontend dependencies.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 10
    - uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: pnpm
        cache-dependency-path: frontend/pnpm-lock.yaml
    - shell: bash
      run: ./scripts/ci/frontend/install.sh
