name: Setup Rust (backend)
description: Pinned toolchain + system deps (scripts/ci/backend-setup-toolchain.sh) and the cargo cache.

inputs:
  components:
    description: Extra rustup components (space separated), e.g. "clippy rustfmt"
    default: ""
  targets:
    description: Extra rustup targets (space separated), e.g. "wasm32-unknown-unknown"
    default: ""
  system-deps:
    description: Install apt packages needed to compile the workspace (ALSA, udev, OpenSSL)
    default: "true"
  cache-key:
    description: Cargo cache key suffix, so jobs with different build profiles don't thrash each other
    default: "default"

runs:
  using: composite
  steps:
    - name: Install toolchain
      shell: bash
      run: |
        args=(--components "${{ inputs.components }}" --targets "${{ inputs.targets }}")
        [[ "${{ inputs.system-deps }}" == "true" ]] && args+=(--system-deps)
        ./scripts/ci/backend-setup-toolchain.sh "${args[@]}"

    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: backend
        shared-key: ${{ inputs.cache-key }}
        save-if: ${{ github.ref == 'refs/heads/main' }}
