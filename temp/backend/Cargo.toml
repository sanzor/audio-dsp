[package]
name = "backend"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4"
actix-cors = "0.7.1"
actix-web-prometheus = "0.1.2"
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-actix-web = "0.7"
utoipa = "5"
utoipa-swagger-ui = { version = "9.0.2", features = ["actix-web"] }
dotenvy = "0.15.7"
prometheus = "0.14"
sha1 = "0.10.6"
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = "9.3.0"
async-stripe = { version = "0.40", default-features = false, features = ["runtime-tokio-hyper", "checkout", "webhook-endpoints", "webhook-events", "connect", "billing"] }
futures-util = "0.3.31"
tokio-util={workspace=true}
lettre = { version = "0.11.19", default-features = false, features = [
    "tokio1-rustls", 
    "tokio1", 
    "hostname", 
    "smtp-transport", 
    "builder", 
    "rustls-tls", 
    "ring",          # Required crypto provider
    "webpki-roots"   # Required for certificate verification
]}

common = { path = "../../scoring/common" }
scoring_domain = { package = "domain", path = "../../scoring/domain" }
infra = { path = "../../scoring/infra" }
rust_shared = { path = "../../rust_shared", features = ["sqlx", "utoipa"] }

redis = { workspace = true }
deadpool-redis = { workspace = true }
sqlx = { workspace = true }
tokio = { version = "1", features = ["full"] }
