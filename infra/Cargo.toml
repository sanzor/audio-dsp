[package]
name="infra"
version = "0.1.0"
edition = "2021"


[dependencies]
serde_json = "1.0"
rstest="0.26.1"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
async-std = { version = "1", features = ["attributes"] }
serde = { version = "1.0", features = ["derive"] }
dtos={path = "../dtos"}
data-provider={path="../data-provider"}
domain={path="../domain"}
ulid="1"