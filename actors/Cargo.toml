[package]
name="actors"
version="0.1.0"
edition = "2021"

[dependencies]
dsp-core={path="../dsp-core"}
domain={path="../domain"}
player={path="../player"}
audiolib={path="../audiolib"}
rstest="0.25"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
async-std = { version = "1", features = ["attributes"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
kameo="0.16"
ulid="1"